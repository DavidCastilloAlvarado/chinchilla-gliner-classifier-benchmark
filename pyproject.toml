[project]
name = "classifier"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "davidcastilloalvarado", email = "david.code.box@pm.me" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "gliner2[local]>=2.0.0",
    "huggingface-hub>=0.36.2",
    "prometheus-client>=0.26.0",
    "protobuf>=7.36.2",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
classifier = "classifier:main"
tests = "pytest:main"
server = "app.cli:server"
server-gpu = "app.cli:server_gpu"
dino = "playground.test_dino:main"
doom = "playground.doom:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "locust>=2.46.6",
    "playwright>=1.58.2",
    "pytest>=8.4.0",
    "vizdoom>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
